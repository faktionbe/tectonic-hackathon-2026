packages:
  - "apps/*"
  - "packages/*"

# Delay installs of newly published versions (minutes) to reduce supply-chain risk.
# 1440 = 1 day (pnpm 11+ default).
allowBuilds:
  '@apollo/protobufjs': true
  '@nestjs/core': true
  '@prisma/engines': true
  '@scarf/scarf': true
  '@swc/core': true
  '@tailwindcss/oxide': true
  argon2: true
  esbuild: true
  prisma: true

minimumReleaseAge: 1440

overrides:
  axios: "^1.20.0"
  lodash: "4.18.1"
