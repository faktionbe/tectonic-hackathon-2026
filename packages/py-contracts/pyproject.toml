[project]
name = "py-contracts"
version = "0.0.1"
description = "ML backend: Contract models"
readme = "README.md"

dependencies = [
    "pydantic>=2.11",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "ruff>=0.1.0",
    "mypy>=1.6.0",
]

[build-system]
requires = ["setuptools >= 64.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
